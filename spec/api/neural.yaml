# Project Biometal - Neural Interface API Specification
# Defines APIs for neural scheduling interface and ML-driven optimization

openapi: 3.0.3
info:
  title: FuncOS Neural Interface API
  description: |
    Neural interface APIs for Project Biometal's FuncOS.
    Enables AI-driven scheduling, optimization hints, and function-level hardware training.
    This is the "MCP on steroids" - supplying function inputs/outputs to neural nets
    for training on hardware requests at the function level.
  version: "0.1.0"

servers:
  - url: http://localhost:8080/api/v1/neural
    description: Development server
  - url: unix:///var/run/funcos/neural.sock
    description: Unix socket interface

paths:
  # === Training Data Collection ===
  /training/functions:
    post:
      summary: Submit function execution data for training
      description: |
        Submit function execution data including inputs, outputs, and hardware
        utilization for neural network training. This is the core of the
        "function-level hardware optimization training" system.
      tags: [Training]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionTrainingData'
      responses:
        '200':
          description: Training data accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingDataResponse'

  /training/batch:
    post:
      summary: Submit batch training data
      description: Submit multiple function executions for batch training
      tags: [Training]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FunctionTrainingData'
      responses:
        '200':
          description: Batch training data accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTrainingResponse'

  /training/status:
    get:
      summary: Get training status
      tags: [Training]
      responses:
        '200':
          description: Training status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingStatus'

  # === Optimization Hints ===
  /optimization/hints:
    post:
      summary: Request optimization hints
      description: |
        Request AI-generated optimization hints for a function based on
        historical execution data and hardware characteristics.
      tags: [Optimization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizationHintRequest'
      responses:
        '200':
          description: Optimization hints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationHints'

  /optimization/feedback:
    post:
      summary: Provide optimization feedback
      description: Provide feedback on applied optimizations for model improvement
      tags: [Optimization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizationFeedback'
      responses:
        '200':
          description: Feedback accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'

  # === Scheduling Interface ===
  /scheduling/predict:
    post:
      summary: Predict optimal scheduling
      description: Get AI predictions for optimal function scheduling
      tags: [Scheduling]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulingPredictionRequest'
      responses:
        '200':
          description: Scheduling predictions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulingPrediction'

  /scheduling/priority:
    post:
      summary: Request priority adjustment
      description: Request AI-driven priority adjustment for function execution
      tags: [Scheduling]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityAdjustmentRequest'
      responses:
        '200':
          description: Priority adjustment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityAdjustment'

  # === Model Management ===
  /models:
    get:
      summary: List available models
      tags: [Models]
      responses:
        '200':
          description: Available models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NeuralModel'

  /models/{modelId}/status:
    get:
      summary: Get model status
      tags: [Models]
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelStatus'

components:
  schemas:
    FunctionTrainingData:
      type: object
      required: [function_id, execution_id, inputs, outputs, hardware_metrics]
      properties:
        function_id:
          type: string
          description: Unique function identifier
        execution_id:
          type: string
          description: Unique execution identifier
        timestamp:
          type: string
          format: date-time
        inputs:
          type: object
          description: Function input parameters and their values
        outputs:
          type: object
          description: Function output values
        hardware_metrics:
          $ref: '#/components/schemas/HardwareMetrics'
        execution_context:
          $ref: '#/components/schemas/ExecutionContext'
        performance_metrics:
          $ref: '#/components/schemas/PerformanceMetrics'

    HardwareMetrics:
      type: object
      properties:
        cpu_utilization:
          type: number
          minimum: 0
          maximum: 100
        memory_usage:
          type: integer
          description: Memory usage in bytes
        cache_hits:
          type: object
          properties:
            l1:
              type: integer
            l2:
              type: integer
            l3:
              type: integer
        cache_misses:
          type: object
          properties:
            l1:
              type: integer
            l2:
              type: integer
            l3:
              type: integer
        instruction_count:
          type: integer
        branch_predictions:
          type: object
          properties:
            correct:
              type: integer
            incorrect:
              type: integer
        power_consumption:
          type: number
          description: Power consumption in watts
        thermal_state:
          type: object
          properties:
            temperature:
              type: number
            throttling:
              type: boolean

    ExecutionContext:
      type: object
      properties:
        hardware_profile:
          type: string
          description: Hardware profile identifier
        system_load:
          type: number
          minimum: 0
          maximum: 100
        concurrent_functions:
          type: integer
        memory_pressure:
          type: string
          enum: [low, medium, high, critical]
        optimization_level:
          type: string
          enum: [none, basic, aggressive, neural]

    PerformanceMetrics:
      type: object
      properties:
        execution_time:
          type: integer
          description: Execution time in microseconds
        memory_allocations:
          type: integer
        memory_deallocations:
          type: integer
        page_faults:
          type: integer
        context_switches:
          type: integer
        system_calls:
          type: integer

    TrainingDataResponse:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, rejected, queued]
        training_id:
          type: string
        message:
          type: string

    BatchTrainingResponse:
      type: object
      properties:
        total_submitted:
          type: integer
        accepted:
          type: integer
        rejected:
          type: integer
        batch_id:
          type: string

    TrainingStatus:
      type: object
      properties:
        total_samples:
          type: integer
        samples_processed:
          type: integer
        models_trained:
          type: integer
        last_training:
          type: string
          format: date-time
        training_accuracy:
          type: number
          minimum: 0
          maximum: 1

    OptimizationHintRequest:
      type: object
      required: [function_id, current_context]
      properties:
        function_id:
          type: string
        current_context:
          $ref: '#/components/schemas/ExecutionContext'
        input_characteristics:
          type: object
          description: Characteristics of the input data
        performance_target:
          type: object
          properties:
            target_metric:
              type: string
              enum: [execution_time, memory_usage, power_consumption, throughput]
            target_value:
              type: number

    OptimizationHints:
      type: object
      properties:
        hint_id:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/OptimizationRecommendation'
        predicted_improvement:
          type: object
          properties:
            execution_time:
              type: number
            memory_usage:
              type: number
            power_consumption:
              type: number

    OptimizationRecommendation:
      type: object
      properties:
        type:
          type: string
          enum: [vectorization, memory_layout, caching, parallelization, hardware_specific]
        description:
          type: string
        implementation_hint:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 10
        estimated_impact:
          type: number

    OptimizationFeedback:
      type: object
      required: [hint_id, applied_recommendations, actual_performance]
      properties:
        hint_id:
          type: string
        applied_recommendations:
          type: array
          items:
            type: string
        actual_performance:
          $ref: '#/components/schemas/PerformanceMetrics'
        satisfaction_rating:
          type: integer
          minimum: 1
          maximum: 5

    FeedbackResponse:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, rejected]
        feedback_id:
          type: string

    SchedulingPredictionRequest:
      type: object
      required: [functions, system_state]
      properties:
        functions:
          type: array
          items:
            type: object
            properties:
              function_id:
                type: string
              priority:
                type: integer
              estimated_duration:
                type: integer
        system_state:
          $ref: '#/components/schemas/ExecutionContext'

    SchedulingPrediction:
      type: object
      properties:
        prediction_id:
          type: string
        recommended_order:
          type: array
          items:
            type: string
        predicted_completion_time:
          type: integer
          description: Total completion time in microseconds
        confidence:
          type: number
          minimum: 0
          maximum: 1

    PriorityAdjustmentRequest:
      type: object
      required: [function_id, current_priority, context]
      properties:
        function_id:
          type: string
        current_priority:
          type: integer
        context:
          $ref: '#/components/schemas/ExecutionContext'
        urgency_factors:
          type: array
          items:
            type: string

    PriorityAdjustment:
      type: object
      properties:
        adjustment_id:
          type: string
        recommended_priority:
          type: integer
        adjustment_reason:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1

    NeuralModel:
      type: object
      properties:
        model_id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [optimization, scheduling, prediction, classification]
        version:
          type: string
        accuracy:
          type: number
          minimum: 0
          maximum: 1
        training_samples:
          type: integer
        last_updated:
          type: string
          format: date-time

    ModelStatus:
      type: object
      properties:
        model_id:
          type: string
        status:
          type: string
          enum: [training, ready, updating, error]
        training_progress:
          type: number
          minimum: 0
          maximum: 100
        last_prediction:
          type: string
          format: date-time
        prediction_count:
          type: integer
        error_rate:
          type: number
          minimum: 0
          maximum: 1
