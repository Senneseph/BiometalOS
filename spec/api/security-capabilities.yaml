# Project Biometal - Security & Capability Management API Specification
# Defines APIs for capability-based access control and security management

openapi: 3.0.3
info:
  title: FuncOS Security & Capability Management API
  description: |
    Security and capability management APIs for Project Biometal's FuncOS.
    Implements capability-based access control, fine-grained permissions,
    and secure-by-default configurations for hardware access.
  version: "0.1.0"
  contact:
    name: Project Biometal
    url: https://github.com/Senneseph/BiometalOS

servers:
  - url: http://localhost:8080/api/v1/security
    description: Development server
  - url: unix:///var/run/funcos/security.sock
    description: Unix socket interface

paths:
  # === Capability Management ===
  /capabilities:
    get:
      summary: List all system capabilities
      description: Retrieve all capabilities available in the system
      tags: [Capabilities]
      responses:
        '200':
          description: System capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemCapability'

  /capabilities/{capabilityId}:
    get:
      summary: Get capability details
      tags: [Capabilities]
      parameters:
        - name: capabilityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Capability details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCapability'

  # === Access Control ===
  /access/request:
    post:
      summary: Request access to capabilities
      description: Request access to specific system capabilities
      tags: [Access Control]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequest'
      responses:
        '200':
          description: Access decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDecision'

  /access/grants:
    get:
      summary: List current access grants
      tags: [Access Control]
      parameters:
        - name: subject
          in: query
          schema:
            type: string
          description: Filter by subject (user, service, etc.)
      responses:
        '200':
          description: Access grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessGrant'

  /access/grants/{grantId}:
    delete:
      summary: Revoke access grant
      tags: [Access Control]
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Access grant revoked

  # === Security Policies ===
  /policies:
    get:
      summary: List security policies
      tags: [Policies]
      responses:
        '200':
          description: Security policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecurityPolicy'
    
    post:
      summary: Create security policy
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicy'

  /policies/{policyId}:
    get:
      summary: Get security policy
      tags: [Policies]
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Security policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicy'

  # === Authentication & Authorization ===
  /auth/authenticate:
    post:
      summary: Authenticate subject
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResult'

  /auth/authorize:
    post:
      summary: Authorize capability access
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
      responses:
        '200':
          description: Authorization decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResult'

  # === Audit & Monitoring ===
  /audit/events:
    get:
      summary: Get security audit events
      tags: [Audit]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'

  /security/status:
    get:
      summary: Get security system status
      tags: [Monitoring]
      responses:
        '200':
          description: Security status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityStatus'

components:
  schemas:
    SystemCapability:
      type: object
      required: [id, name, type, risk_level]
      properties:
        id:
          type: string
          description: Unique capability identifier
        name:
          type: string
          description: Human-readable capability name
        type:
          type: string
          enum: [hardware, network, filesystem, memory, computation, neural]
        risk_level:
          type: string
          enum: [minimal, low, medium, high, critical]
        description:
          type: string
        prerequisites:
          type: array
          items:
            type: string
          description: Required capabilities or conditions
        constraints:
          type: object
          description: Usage constraints and limits
        default_policy:
          type: string
          enum: [allow, deny, prompt]

    AccessRequest:
      type: object
      required: [subject, capabilities, context]
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        capabilities:
          type: array
          items:
            type: string
          description: Requested capability IDs
        context:
          $ref: '#/components/schemas/AccessContext'
        justification:
          type: string
        duration:
          type: integer
          description: Requested access duration in seconds

    Subject:
      type: object
      required: [type, identifier]
      properties:
        type:
          type: string
          enum: [user, service, function, browser_origin, process]
        identifier:
          type: string
        attributes:
          type: object
          description: Subject-specific attributes
        credentials:
          type: object
          description: Authentication credentials

    AccessContext:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        source_ip:
          type: string
        user_agent:
          type: string
        session_id:
          type: string
        environment:
          type: string
          enum: [development, testing, production]
        risk_factors:
          type: array
          items:
            type: string

    AccessDecision:
      type: object
      properties:
        decision:
          type: string
          enum: [granted, denied, conditional]
        grants:
          type: array
          items:
            $ref: '#/components/schemas/AccessGrant'
        conditions:
          type: array
          items:
            type: string
        reason:
          type: string
        expires_at:
          type: string
          format: date-time

    AccessGrant:
      type: object
      properties:
        grant_id:
          type: string
        subject:
          $ref: '#/components/schemas/Subject'
        capability:
          type: string
        granted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        constraints:
          type: object
        usage_count:
          type: integer
        max_usage:
          type: integer

    SecurityPolicy:
      type: object
      required: [id, name, rules]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRule'
        priority:
          type: integer
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    PolicyRule:
      type: object
      required: [condition, action]
      properties:
        condition:
          type: object
          description: Rule condition (JSON logic)
        action:
          type: string
          enum: [allow, deny, prompt, log, alert]
        parameters:
          type: object
        description:
          type: string

    PolicyRequest:
      type: object
      required: [name, rules]
      properties:
        name:
          type: string
        description:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRule'
        priority:
          type: integer

    AuthenticationRequest:
      type: object
      required: [subject, method]
      properties:
        subject:
          $ref: '#/components/schemas/Subject'
        method:
          type: string
          enum: [password, certificate, biometric, token]
        credentials:
          type: object
        challenge_response:
          type: string

    AuthenticationResult:
      type: object
      properties:
        authenticated:
          type: boolean
        subject_id:
          type: string
        session_token:
          type: string
        expires_at:
          type: string
          format: date-time
        attributes:
          type: object

    AuthorizationRequest:
      type: object
      required: [subject_id, capability, context]
      properties:
        subject_id:
          type: string
        capability:
          type: string
        context:
          $ref: '#/components/schemas/AccessContext'
        resource:
          type: string
        action:
          type: string

    AuthorizationResult:
      type: object
      properties:
        authorized:
          type: boolean
        reason:
          type: string
        conditions:
          type: array
          items:
            type: string
        audit_id:
          type: string

    AuditEvent:
      type: object
      properties:
        event_id:
          type: string
        timestamp:
          type: string
          format: date-time
        event_type:
          type: string
          enum: [authentication, authorization, access_grant, policy_violation, security_alert]
        severity:
          type: string
          enum: [low, medium, high, critical]
        subject:
          $ref: '#/components/schemas/Subject'
        details:
          type: object
        outcome:
          type: string
          enum: [success, failure, blocked]

    SecurityStatus:
      type: object
      properties:
        overall_status:
          type: string
          enum: [secure, warning, alert, critical]
        active_policies:
          type: integer
        active_grants:
          type: integer
        recent_violations:
          type: integer
        threat_level:
          type: string
          enum: [low, medium, high, critical]
        last_audit:
          type: string
          format: date-time
