# Project Biometal - Build Specification
# Specification-first build definitions for FuncOS

# === Project Metadata ===
project:
  name: "Project Biometal"
  os_name: "FuncOS"
  version: "0.1.0"
  architecture_philosophy: "functional-actualization"
  memory_model: "controlled-unsafe"

# === Target Architectures ===
architectures:
  primary: "x86_64"
  supported:
    - name: "x86_64"
      description: "Primary development target"
      toolchain: "zig"
      features: ["sse2", "avx"]
      
    - name: "arm64"
      description: "Apple M1/M2+, Raspberry Pi 4/5"
      toolchain: "zig"
      features: ["neon", "crypto"]
      
  detection:
    strategy: "runtime"
    fallback: "x86_64"
    multi_target: true

# === Toolchain Requirements ===
toolchain:
  primary:
    name: "zig"
    version: "0.12.0"
    source: "docker.io/zigtools/zig:0.12.0"
    rationale: "Memory control with safety guardrails"
    
  alternatives:
    - name: "rust"
      version: "1.75+"
      use_case: "compatibility-modules"
      
    - name: "gcc"
      version: "11+"
      use_case: "legacy-integration"
      
  assembly:
    required: true
    purpose: "boot-stages"
    assembler: "nasm"

# === Build Artifacts ===
artifacts:
  kernel:
    name: "funcos-kernel"
    format: "elf"
    output: "./dist/kernel/funcos-kernel.elf"
    components:
      - "scheduler"
      - "function-manager"
      - "memory-manager"
      - "io-bus"
      - "neural-interface-stub"
      
  bootloader:
    name: "funcos-boot"
    format: "bin"
    output: "./dist/boot/funcos-boot.bin"
    compatibility: ["grub2", "uefi"]
    
  userland:
    name: "funcos-userland"
    format: "tar.gz"
    output: "./dist/userland/funcos-userland.tar.gz"
    components:
      - "bloom-shell"
      - "function-loader"
      - "introspection-tools"
      
  iso:
    name: "funcos-complete"
    format: "iso"
    output: "./dist/funcos-complete.iso"
    bootable: true

# === Off-the-Shelf Components ===
components:
  base_images:
    - name: "zig-toolchain"
      source: "docker.io/zigtools/zig:0.12.0"
      purpose: "Primary compilation environment"
      
    - name: "qemu-system"
      source: "docker.io/qemu/qemu:8.0"
      purpose: "VM testing and emulation"
      
    - name: "alpine-base"
      source: "docker.io/alpine:latest"
      purpose: "Lightweight container base"
      
  libraries:
    - name: "libc-minimal"
      source: "musl"
      version: "1.2.4"
      purpose: "Minimal C library for compatibility"
      
    - name: "neural-interface-stub"
      source: "internal"
      purpose: "Mock neural scheduling interface"

# === Build Stages ===
stages:
  validate:
    description: "Validate all specifications"
    dependencies: []
    outputs: ["validation-report.json"]
    
  profile:
    description: "Detect hardware capabilities"
    dependencies: ["validate"]
    outputs: ["hardware-profile.yaml"]
    
  prepare:
    description: "Prepare build environment"
    dependencies: ["profile"]
    actions:
      - "fetch-toolchain"
      - "setup-cross-compilation"
      - "prepare-build-cache"
      
  compile:
    description: "Compile all components"
    dependencies: ["prepare"]
    parallel: true
    components:
      - "kernel"
      - "bootloader"
      - "userland"
      
  link:
    description: "Link and create final artifacts"
    dependencies: ["compile"]
    outputs: ["kernel.elf", "boot.bin", "userland.tar.gz"]
    
  package:
    description: "Create distribution packages"
    dependencies: ["link"]
    outputs: ["funcos-complete.iso"]
    
  test:
    description: "Test in virtualized environment"
    dependencies: ["package"]
    test_suites: ["boot", "function", "integration"]

# === Build Configuration ===
configuration:
  optimization:
    debug:
      level: "O0"
      debug_symbols: true
      assertions: true
      
    release:
      level: "O2"
      debug_symbols: false
      assertions: false
      
    profile:
      level: "O2"
      debug_symbols: true
      profiling: true
      
  memory_safety:
    controlled:
      bounds_checking: "runtime"
      null_checking: true
      overflow_detection: true
      
    unsafe:
      bounds_checking: false
      null_checking: false
      direct_memory_access: true

# === Testing Strategy ===
testing:
  unit_tests:
    framework: "zig-test"
    coverage_target: "80%"
    
  integration_tests:
    vm_testing: true
    qemu_config:
      memory: "64M"
      cpu: "486"
      
  performance_tests:
    benchmarks: ["boot-time", "function-dispatch", "memory-allocation"]
    targets: ["< 5s boot", "< 1μs dispatch", "< 100ns allocation"]

# === Quality Assurance ===
quality:
  static_analysis: true
  memory_leak_detection: true
  deterministic_builds: true
  reproducible_artifacts: true
  
# === Remote Agent Optimization ===
remote_agent:
  build_caching: true
  parallel_builds: true
  incremental_compilation: true
  artifact_sharing: true
