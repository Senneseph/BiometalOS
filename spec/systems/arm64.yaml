# Project Biometal - ARM64 System Specification
# Defines how FuncOS APIs work on ARM64 architecture

system:
  name: "arm64"
  description: "ARM 64-bit architecture implementation (AArch64)"
  primary_target: false
  
architecture:
  instruction_set: "aarch64"
  endianness: "little"
  word_size: 64
  address_space: 48  # bits (can be 52 with ARMv8.2-A)
  
  # ARM64 feature support
  extensions:
    required:
      - "neon"      # Advanced SIMD
    recommended:
      - "crypto"    # Cryptographic extensions
      - "crc32"     # CRC32 instructions
    optional:
      - "sve"       # Scalable Vector Extensions
      - "sve2"      # Scalable Vector Extensions 2
      - "bf16"      # Brain Float 16

# === API Implementation Mappings ===
api_implementations:
  
  # Core API Implementation
  core_api:
    function_registration:
      implementation: "native_aarch64"
      calling_convention: "aapcs64"
      stack_alignment: 16
      
    function_execution:
      execution_modes:
        - name: "native"
          description: "Direct native execution"
          performance: "highest"
          safety: "controlled"
          
        - name: "sandboxed"
          description: "Sandboxed execution with memory protection"
          performance: "high"
          safety: "high"
          
        - name: "interpreted"
          description: "Interpreted execution for maximum safety"
          performance: "medium"
          safety: "highest"
          
    memory_management:
      page_size: 4096
      large_page_support: true
      large_page_sizes: [2097152, 1073741824]  # 2MB, 1GB
      virtual_address_space: 281474976710656   # 2^48 bytes
      
  # Hardware API Implementation  
  hardware_api:
    discovery:
      cpu_detection:
        method: "device_tree"
        feature_detection: "cpuid_registers"
        
      memory_detection:
        method: "device_tree_memory"
        numa_detection: "acpi_srat"  # On ACPI systems
        
    performance_counters:
      implementation: "arm_pmu"
      counters:
        - "cpu_cycles"
        - "instructions_retired"
        - "cache_references"
        - "cache_misses"
        - "branch_instructions"
        - "branch_misses"
        
    execution_units:
      alu:
        count: "per_core"
        capabilities: ["integer_arithmetic", "bitwise_operations"]
        
      fpu:
        count: 1
        capabilities: ["ieee754_float", "half_precision"]
        
      simd:
        neon:
          width: 128
          capabilities: ["float32x4", "float64x2", "int32x4", "int16x8", "int8x16"]
        sve:
          width: "variable"  # 128-2048 bits
          capabilities: ["scalable_vectors", "predicated_execution"]
          conditional: "sve_support"
          
  # Neural API Implementation
  neural_api:
    training_data_collection:
      hardware_counters: "arm_pmu"
      memory_tracking: "page_fault_handler"
      cache_analysis: "perf_events"
      
    optimization_targets:
      vectorization:
        neon: "automatic"
        sve: "conditional"
        
      memory_optimization:
        prefetching: "hardware_prefetcher"
        alignment: "cache_line_alignment"
        
      branch_optimization:
        prediction: "hardware_branch_predictor"
        elimination: "conditional_select"

# === System-Specific Features ===
features:
  
  # Memory Management
  memory:
    virtual_memory: true
    memory_protection: true
    numa_support: "conditional"  # Depends on system
    huge_pages: true
    memory_tagging: "conditional"  # ARMv8.5-A MTE
    
  # Security Features
  security:
    nx_bit: true
    pan: true   # Privileged Access Never
    uao: true   # User Access Override
    pointer_auth: "conditional"  # ARMv8.3-A
    
  # Virtualization
  virtualization:
    el2_hypervisor: true
    stage2_translation: true
    iommu: "conditional"
    
  # Power Management
  power:
    frequency_scaling: true
    cluster_switching: "conditional"  # big.LITTLE
    dvfs: true  # Dynamic Voltage and Frequency Scaling

# === Platform-Specific Implementations ===
platforms:
  
  # Apple Silicon (M1/M2/M3)
  apple_silicon:
    features:
      - "unified_memory"
      - "neural_engine"
      - "custom_pmu"
    optimizations:
      - "memory_bandwidth_optimization"
      - "neural_acceleration"
    limitations:
      - "no_virtualization_in_vm"
      
  # Raspberry Pi 4/5
  raspberry_pi:
    features:
      - "gpio_access"
      - "hardware_video_decode"
    optimizations:
      - "low_power_mode"
      - "thermal_throttling"
    limitations:
      - "limited_memory_bandwidth"
      - "no_hardware_crypto"
      
  # Server ARM (Ampere Altra, AWS Graviton)
  server_arm:
    features:
      - "large_core_count"
      - "numa_topology"
      - "hardware_crypto"
    optimizations:
      - "numa_aware_allocation"
      - "crypto_acceleration"
    limitations:
      - "variable_sve_width"

# === Build Configuration ===
build:
  toolchain:
    primary: "zig"
    alternatives: ["gcc-aarch64", "clang"]
    
  compiler_flags:
    base: ["-target", "aarch64-unknown-linux-gnu"]
    optimization:
      debug: ["-O0", "-g"]
      release: ["-O2", "-DNDEBUG"]
      performance: ["-O3", "-mcpu=native"]
      
  cross_compilation:
    host: "x86_64"
    target: "aarch64"
    sysroot: "/usr/aarch64-linux-gnu"
    
  linker:
    format: "elf64"
    entry_point: "_start"
    sections:
      text: "0x400000"
      data: "0x600000"
      
  boot:
    format: "linux_kernel"
    loader: "u-boot"
    device_tree: true
    
# === Runtime Configuration ===
runtime:
  
  # Scheduler Configuration
  scheduler:
    algorithm: "cfs_with_neural_hints"
    time_slice: "1ms"
    preemption: true
    big_little_aware: "conditional"
    
  # Memory Allocator
  memory_allocator:
    algorithm: "buddy_system"
    page_size: 4096
    slab_allocator: true
    
  # Function Execution
  function_execution:
    default_mode: "native"
    safety_checks: "runtime"
    stack_size: "2MB"
    
# === Performance Characteristics ===
performance:
  
  # Expected Performance Metrics
  function_dispatch:
    native: "< 15ns"
    sandboxed: "< 150ns"
    interpreted: "< 1.5μs"
    
  memory_allocation:
    small_objects: "< 75ns"
    large_objects: "< 750ns"
    huge_pages: "< 7.5μs"
    
  context_switch:
    user_to_kernel: "< 1.5μs"
    process_switch: "< 15μs"
    
  # Cache Performance (typical ARM Cortex-A cores)
  cache_latency:
    l1: "2-4 cycles"
    l2: "15-25 cycles"
    l3: "50-100 cycles"
    memory: "150-400 cycles"

# === Testing Strategy ===
testing:
  
  # Hardware Requirements for Testing
  minimum_hardware:
    cpu: "ARMv8-A with NEON"
    memory: "1GB"
    storage: "8GB"
    
  recommended_hardware:
    cpu: "ARMv8.2-A or later"
    memory: "4GB"
    storage: "32GB"
    
  # Test Suites
  test_suites:
    - name: "neon_instruction_tests"
      description: "Test NEON SIMD instructions"
      
    - name: "memory_management_tests"
      description: "Test virtual memory and allocation"
      
    - name: "cross_platform_tests"
      description: "Test compatibility across ARM implementations"
      
    - name: "big_little_tests"
      description: "Test big.LITTLE cluster switching"
      conditional: "big_little_support"
      
  # Emulation Testing
  vm_testing:
    qemu:
      cpu: "cortex-a57"
      memory: "64M"
      acceleration: "tcg"  # No KVM on cross-platform
      
# === Platform-Specific Optimizations ===
optimizations:
  
  # Memory Optimizations
  memory:
    - name: "cache_line_prefetch"
      description: "Optimize for 64-byte cache lines"
      
    - name: "numa_locality"
      description: "Prefer local memory access"
      conditional: "numa_support"
      
  # SIMD Optimizations
  simd:
    - name: "neon_vectorization"
      description: "Automatic NEON vectorization"
      
    - name: "sve_scalable"
      description: "SVE scalable vector optimization"
      conditional: "sve_support"
      
  # Power Optimizations
  power:
    - name: "frequency_scaling"
      description: "Dynamic frequency adjustment"
      
    - name: "cluster_migration"
      description: "Migrate tasks between big/LITTLE clusters"
      conditional: "big_little_support"

# === Limitations and Constraints ===
limitations:
  
  # Known Limitations
  - description: "SVE width varies by implementation"
    impact: "Vector optimizations must be adaptive"
    
  - description: "Memory tagging requires ARMv8.5-A"
    impact: "Security features limited on older cores"
    
  - description: "Cross-compilation complexity"
    impact: "Build system must handle multiple toolchains"
    
  # Resource Constraints
  constraints:
    max_functions: 32768  # Lower than x86_64 due to typical memory constraints
    max_memory_per_function: "512MB"
    max_execution_time: "10s"
    
# === Compatibility Matrix ===
compatibility:
  
  # ARM Core Compatibility
  cores:
    cortex_a53:
      performance: "low"
      features: ["neon"]
      
    cortex_a72:
      performance: "medium"
      features: ["neon", "crypto"]
      
    cortex_a78:
      performance: "high"
      features: ["neon", "crypto", "bf16"]
      
    apple_m1:
      performance: "very_high"
      features: ["neon", "crypto", "custom_extensions"]
      
    graviton3:
      performance: "high"
      features: ["neon", "crypto", "sve"]
