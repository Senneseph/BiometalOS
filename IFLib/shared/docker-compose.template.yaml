# WebAXP Shared Container Template
# Terraform-like configuration for sub-projects

version: '3.8'

# Template service definition
x-webaxp-base: &webaxp-base
  build:
    context: ./shared/webaxp-base
    args:
      - PROJECT_TYPE=${PROJECT_TYPE:-generic}
      - TOOLCHAIN=${TOOLCHAIN:-multi}
      - TARGET_ARCH=${TARGET_ARCH:-x86_64}
      - FEATURES=${FEATURES:-}
  volumes:
    - ./spec:/workspace/spec:ro
    - ./config:/workspace/config:ro
    - ./develop:/workspace/develop:ro
    - ./app:/workspace/app
    - ./build:/workspace/build
    - ./dist:/workspace/dist
    - ./docs:/workspace/docs
    - webaxp-cache:/workspace/cache
  environment:
    - PROJECT_NAME=${PROJECT_NAME:-webaxp-project}
    - PROJECT_TYPE=${PROJECT_TYPE:-generic}
    - BUILD_MODE=${BUILD_MODE:-debug}
    - LOG_LEVEL=${LOG_LEVEL:-info}
  networks:
    - webaxp-network

services:
  # Development environment
  dev:
    <<: *webaxp-base
    container_name: ${PROJECT_NAME:-webaxp}-dev
    ports:
      - "${DEV_PORT:-8080}:8080"
      - "${DEBUG_PORT:-2345}:2345"
    command: ["bash"]
    profiles: ["dev", "all"]

  # Build environment
  build:
    <<: *webaxp-base
    container_name: ${PROJECT_NAME:-webaxp}-build
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-webaxp-project}
      - PROJECT_TYPE=${PROJECT_TYPE:-generic}
      - BUILD_MODE=${BUILD_MODE:-release}
      - PARALLEL_JOBS=${PARALLEL_JOBS:-4}
    command: ["/usr/local/bin/process-config.sh", "./develop/scripts/build.sh"]
    profiles: ["build", "all"]

  # Test environment
  test:
    <<: *webaxp-base
    container_name: ${PROJECT_NAME:-webaxp}-test
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-webaxp-project}
      - PROJECT_TYPE=${PROJECT_TYPE:-generic}
      - TEST_SUITE=${TEST_SUITE:-all}
    command: ["/usr/local/bin/process-config.sh", "./develop/scripts/test.sh"]
    depends_on:
      - build
    profiles: ["test", "all"]

  # Documentation generator
  docs:
    <<: *webaxp-base
    container_name: ${PROJECT_NAME:-webaxp}-docs
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-webaxp-project}
      - DOC_FORMAT=${DOC_FORMAT:-markdown}
    ports:
      - "${DOCS_PORT:-3000}:3000"
    command: ["/usr/local/bin/process-config.sh", "./develop/scripts/docs.sh"]
    profiles: ["docs", "all"]

# Shared networks
networks:
  webaxp-network:
    name: ${PROJECT_NAME:-webaxp}-network
    driver: bridge

# Shared volumes
volumes:
  webaxp-cache:
    name: ${PROJECT_NAME:-webaxp}-cache
