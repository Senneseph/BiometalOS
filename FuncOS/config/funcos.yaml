# FuncOS Configuration
# Function-oriented operating system configuration

project:
  name: "FuncOS"
  type: "operating-system"
  version: "0.1.0"
  description: "Function-oriented operating system with hardware abstraction"

# Core FuncOS Configuration
funcos:
  mode: "development"
  scheduler:
    type: "neural-driven"
    quantum: 10ms
    priority_levels: 10
    deadline_aware: true
  
  memory:
    allocator: "buddy"
    page_size: 4096
    virtual_memory: true
    protection: true
  
  security:
    capability_based: true
    fine_grained_permissions: true
    audit_enabled: true

# Hardware Abstraction Configuration
hardware:
  discovery:
    auto_detect: true
    profiling: true
    performance_counters: true
  
  optimization:
    architecture_aware: true
    execution_actualizer: true
    target_selection: "optimal"

# Service Discovery Configuration
services:
  discovery:
    enabled: true
    capability_based: true
    health_monitoring: true
  
  sla:
    deadline_driven: true
    performance_guarantees: true
    graceful_degradation: true

# ZealOS Integration Configuration
zealos:
  repository: "https://github.com/Senneseph/ZealOS"
  branch: "main"
  build_type: "iso"
  integration_method: "foundation"
  
  build:
    toolchain: "gcc"
    target: "x86_64"
    optimization: "size"
    debug_symbols: true

# Development Configuration
development:
  hot_reload: true
  debug_mode: true
  profiling: true
  introspection: true
  
  testing:
    unit_tests: true
    integration_tests: true
    performance_tests: true
    hardware_tests: true

# API Configuration
api:
  validation: true
  documentation: "auto-generate"
  versioning: "semantic"
  
  endpoints:
    core: "enabled"
    hardware: "enabled"
    service_discovery: "enabled"
    security: "enabled"
