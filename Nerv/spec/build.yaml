# Project Biometal - Build Specification
# Specification-first build definitions for FuncOS

# === Project Metadata ===
project:
  name: "Project Biometal"
  os_name: "FuncOS"
  version: "0.1.0"
  architecture_philosophy: "functional-actualization"
  memory_model: "controlled-unsafe"

# === Target Architectures ===
architectures:
  primary: "x86_64"
  supported:
    - name: "x86_64"
      description: "Primary development target"
      toolchain: "zig"
      features: ["sse2", "avx"]

    - name: "arm64"
      description: "Apple M1/M2+, Raspberry Pi 4/5"
      toolchain: "zig"
      features: ["neon", "crypto"]

    - name: "arm-cortex-m4"
      description: "Arduino Uno R4, STM32F4 series"
      toolchain: "zig"
      features: ["thumb2", "fpu"]
      memory_constraints:
        flash: "256KB"
        sram: "32KB"

    - name: "esp32"
      description: "ESP32 microcontroller"
      toolchain: "zig"
      features: ["wifi", "bluetooth", "dual_core"]
      memory_constraints:
        flash: "4MB"
        sram: "520KB"

  detection:
    strategy: "runtime"
    fallback: "x86_64"
    multi_target: true

# === Toolchain Requirements ===
toolchain:
  primary:
    name: "zig"
    version: "0.12.0"
    source: "docker.io/zigtools/zig:0.12.0"
    rationale: "Memory control with safety guardrails"
    
  alternatives:
    - name: "rust"
      version: "1.75+"
      use_case: "compatibility-modules"
      
    - name: "gcc"
      version: "11+"
      use_case: "legacy-integration"
      
  assembly:
    required: true
    purpose: "boot-stages"
    assembler: "nasm"

# === Build Artifacts ===
artifacts:
  # Desktop/Server kernel
  kernel:
    name: "nerv-kernel"
    format: "elf"
    output: "./dist/kernel/nerv-kernel.elf"
    components:
      - "microkernel"
      - "ipc-manager"
      - "memory-manager"
      - "task-scheduler"
    dependencies:
      - "spec/api/*.yaml"
      - "app/src/kernel/**/*.zig"
    build_command: "./build/scripts/build-kernel.sh"

  # Arduino firmware
  arduino_firmware:
    name: "nerv-arduino"
    format: "hex"
    output: "./dist/firmware/nerv-arduino.hex"
    target: "arm-cortex-m4"
    components:
      - "microkernel"
      - "task-scheduler"
      - "serial-interface"
      - "biometal-reporter"
    dependencies:
      - "spec/applications/arduino-demo.yaml"
      - "spec/systems/arduino.yaml"
      - "app/src/arduino/**/*.zig"
      - "../FuncOS/app/src/arduino/**/*.zig"
      - "../Biometal/app/src/arduino/**/*.zig"
    build_command: "./build/scripts/build-arduino.sh"
    idempotent: true
    checksum_file: "./build/.arduino-build-checksum"

  # ESP32 firmware
  esp32_firmware:
    name: "nerv-esp32"
    format: "bin"
    output: "./dist/firmware/nerv-esp32.bin"
    target: "esp32"
    components:
      - "microkernel"
      - "task-scheduler"
      - "wifi-interface"
      - "serial-interface"
      - "biometal-reporter"
    dependencies:
      - "spec/systems/esp32.yaml"
      - "app/src/esp32/**/*.zig"
    build_command: "./build/scripts/build-esp32.sh"
    idempotent: true
    checksum_file: "./build/.esp32-build-checksum"

  # QEMU test image
  qemu_test:
    name: "nerv-qemu"
    format: "elf"
    output: "./dist/test/nerv-qemu.elf"
    target: "arm-cortex-m4"
    emulation: true
    dependencies:
      - "arduino_firmware"
    test_command: "./build/scripts/test-qemu.sh"
    idempotent: true

# === Idempotent Build Configuration ===
idempotency:
  enabled: true
  checksum_algorithm: "sha256"
  dependency_tracking: true
  incremental_builds: true

  cache_locations:
    - "./build/.build-cache/"
    - "./build/.dependency-cache/"
    - "./build/.checksum-cache/"

  invalidation_triggers:
    - "spec_file_changes"
    - "source_file_changes"
    - "build_script_changes"
    - "toolchain_version_changes"

# === Off-the-Shelf Components ===
components:
  base_images:
    - name: "zig-toolchain"
      source: "docker.io/zigtools/zig:0.12.0"
      purpose: "Primary compilation environment"
      
    - name: "qemu-system"
      source: "docker.io/qemu/qemu:8.0"
      purpose: "VM testing and emulation"
      
    - name: "alpine-base"
      source: "docker.io/alpine:latest"
      purpose: "Lightweight container base"
      
  libraries:
    - name: "libc-minimal"
      source: "musl"
      version: "1.2.4"
      purpose: "Minimal C library for compatibility"
      
    - name: "neural-interface-stub"
      source: "internal"
      purpose: "Mock neural scheduling interface"

# === Build Stages ===
stages:
  validate:
    description: "Validate all specifications"
    dependencies: []
    outputs: ["validation-report.json"]
    validates:
      - "spec/api/*.yaml"
      - "spec/systems/*.yaml"
      - "spec/build.yaml"
      - "spec/docs.yaml"

  generate:
    description: "Generate code and documentation from specifications"
    dependencies: ["validate"]
    outputs: ["generated-code", "generated-docs"]
    generates:
      - source: "spec/api/*.yaml"
        target: "app/src/api/"
        type: "api_implementation_stubs"
      - source: "spec/systems/*.yaml"
        target: "build/targets/"
        type: "build_configurations"
      - source: "spec/docs.yaml"
        target: "docs/"
        type: "documentation"

  profile:
    description: "Detect hardware capabilities"
    dependencies: ["validate"]
    outputs: ["hardware-profile.yaml"]

  prepare:
    description: "Prepare build environment"
    dependencies: ["generate", "profile"]
    actions:
      - "fetch-toolchain"
      - "setup-cross-compilation"
      - "prepare-build-cache"
      
  compile:
    description: "Compile all components"
    dependencies: ["prepare"]
    parallel: true
    components:
      - "kernel"
      - "bootloader"
      - "userland"
      
  link:
    description: "Link and create final artifacts"
    dependencies: ["compile"]
    outputs: ["kernel.elf", "boot.bin", "userland.tar.gz"]
    
  package:
    description: "Create distribution packages"
    dependencies: ["link"]
    outputs: ["funcos-complete.iso"]
    
  test:
    description: "Test in virtualized environment"
    dependencies: ["package"]
    test_suites: ["boot", "function", "integration"]

# === Build Configuration ===
configuration:
  optimization:
    debug:
      level: "O0"
      debug_symbols: true
      assertions: true
      
    release:
      level: "O2"
      debug_symbols: false
      assertions: false
      
    profile:
      level: "O2"
      debug_symbols: true
      profiling: true
      
  memory_safety:
    controlled:
      bounds_checking: "runtime"
      null_checking: true
      overflow_detection: true
      
    unsafe:
      bounds_checking: false
      null_checking: false
      direct_memory_access: true

# === Testing Strategy ===
testing:
  unit_tests:
    framework: "zig-test"
    coverage_target: "80%"
    
  integration_tests:
    vm_testing: true
    qemu_config:
      memory: "64M"
      cpu: "486"
      
  performance_tests:
    benchmarks: ["boot-time", "function-dispatch", "memory-allocation"]
    targets: ["< 5s boot", "< 1μs dispatch", "< 100ns allocation"]

# === Quality Assurance ===
quality:
  static_analysis: true
  memory_leak_detection: true
  deterministic_builds: true
  reproducible_artifacts: true
  
# === Remote Agent Optimization ===
remote_agent:
  build_caching: true
  parallel_builds: true
  incremental_compilation: true
  artifact_sharing: true
