# Nerv Configuration
# Minimal microkernel configuration

project:
  name: "Nerv"
  type: "microkernel"
  version: "0.1.0"
  description: "Minimal microkernel inspired by Mach/Hurd architecture"

# Core Microkernel Configuration
kernel:
  type: "microkernel"
  minimal: true
  user_space_services: true
  
  memory:
    virtual_memory: true
    page_size: 4096
    protection_domains: true
    copy_on_write: true
  
  scheduling:
    preemptive: true
    priority_based: true
    real_time: false

# IPC Configuration
ipc:
  message_passing: "synchronous"
  port_based: true
  capability_transfer: true
  
  optimization:
    zero_copy: true
    shared_memory: true
    fast_path: true
  
  security:
    capability_based: true
    isolation: true
    validation: true

# Mach/Hurd Inspiration
mach_compatibility:
  enabled: true
  port_management: true
  message_format: "mach-inspired"
  
hurd_features:
  translators: true
  user_space_drivers: true
  modular_services: true

# Process Management
processes:
  lightweight: true
  isolation: true
  resource_management: true
  
  threads:
    kernel_threads: true
    user_threads: true
    scheduling: "priority"

# Hardware Abstraction
hardware:
  minimal_interface: true
  interrupt_handling: true
  device_drivers: "user-space"
  
  platforms:
    x86_64: true
    arm64: false
    riscv: false

# Development Configuration
development:
  debugging: true
  profiling: true
  tracing: true
  
  testing:
    unit_tests: true
    integration_tests: true
    stress_tests: true
    formal_verification: false

# Security Configuration
security:
  capability_based: true
  isolation: "strong"
  audit: true
  
  policies:
    mandatory_access_control: false
    discretionary_access_control: true
    role_based_access_control: false
